[package]
name = "waygate"
version = "0.1.0"
description = "A themed launcher in front of Battle.net"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls", "gzip"] }
# Windows' own TLS (schannel): trusts what Windows trusts, so antivirus HTTPS
# scanning and company proxies work as they do in a browser.
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
