<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waygate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" id="bg"></div>

<nav class="rail" id="rail" aria-label="Installed games"></nav>

<header class="top">
  <span class="wordmark" id="wordmark">WAYGATE</span>
  <span class="where" id="where"></span>
</header>

<main class="intro" id="intro">
  <div class="kicker" id="kicker"></div>
  <h1 id="title">Waygate</h1>
  <p id="lead">Looking for your games...</p>
  <div class="flavors" id="flavors" role="radiogroup" aria-label="Game version"></div>
  <div class="play-row">
    <button class="play" id="play" disabled>Play</button>
  </div>
  <div class="ver" id="ver"></div>
  <div class="msg" id="msg" role="status"></div>
</main>

<div class="caption" id="caption"></div>

<script src="app.js"></script>
</body>
</html>
